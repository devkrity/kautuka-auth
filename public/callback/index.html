<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kautuka sign-in</title>
  <style>
    body { font-family: "Segoe UI", sans-serif; margin: 2rem; color: #1c1917; }
    p { max-width: 36rem; }
  </style>
</head>
<body>
  <p id="status">Returning to Kautuka…</p>
  <script>
    const status = document.getElementById('status');
    const query = new URLSearchParams(location.search);
    const stored = sessionStorage.getItem('kautukaAuthReturn');
    sessionStorage.removeItem('kautukaAuthReturn');
    if (!isAllowedReturn(stored)) {
      status.textContent = 'Kautuka could not find the browser you started from. Start again from the Connectors page.';
    } else {
      const target = new URL(stored);
      const hash = new URLSearchParams();
      for (const name of ['code', 'state', 'error', 'error_description']) {
        const value = query.get(name);
        if (value) hash.set(name, value);
      }
      target.hash = hash.toString();
      location.replace(target.toString());
    }

    function isAllowedReturn(value) {
      if (!value) return false;
      let url;
      try { url = new URL(value); } catch { return false; }
      if (url.username || url.password) return false;
      if (url.pathname !== '/connectors') return false;
      if (url.search || url.hash) return false;
      if (url.protocol === 'https:') return true;
      if (url.protocol !== 'http:') return false;
      return isPrivateHost(url.hostname);
    }

    function isPrivateHost(host) {
      const name = host.toLowerCase();
      if (name === 'localhost' || name === '127.0.0.1' || name === '::1' || name.endsWith('.local')) return true;
      const parts = name.split('.').map(Number);
      if (parts.length === 4 && parts.every((part) => part >= 0 && part <= 255)) {
        if (parts[0] === 10) return true;
        if (parts[0] === 172 && parts[1] >= 16 && parts[1] <= 31) return true;
        if (parts[0] === 192 && parts[1] === 168) return true;
      }
      return false;
    }
  </script>
</body>
</html>
