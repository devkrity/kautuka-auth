<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kautuka sign-in</title>
  <style>
    body { font-family: "Segoe UI", sans-serif; margin: 2rem; color: #1c1917; }
    p { max-width: 36rem; }
  </style>
</head>
<body>
  <p id="status">Returning to Kautuka…</p>
  <script type="module">
    import { isAllowedReturn } from '/return-path.js';

    const status = document.getElementById('status');
    const query = new URLSearchParams(location.search);
    const stored = sessionStorage.getItem('kautukaAuthReturn');
    const connector = sessionStorage.getItem('kautukaAuthConnector');
    sessionStorage.removeItem('kautukaAuthReturn');
    sessionStorage.removeItem('kautukaAuthConnector');
    if (!isAllowedReturn(stored, connector)) {
      status.textContent = 'Kautuka could not find the browser you started from. Start again from Kautuka.';
    } else {
      const target = new URL(stored);
      const hash = new URLSearchParams();
      for (const name of ['code', 'state', 'error', 'error_description']) {
        const value = query.get(name);
        if (value) hash.set(name, value);
      }
      target.hash = hash.toString();
      location.replace(target.toString());
    }
  </script>
</body>
</html>
