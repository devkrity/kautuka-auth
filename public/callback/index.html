<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kautuka sign-in</title>
  <link rel="stylesheet" href="/broker.css">
</head>
<body>
  <main>
    <div class="brand" aria-label="Kautuka account access">
      <svg class="brand-mark" viewBox="0 0 40 40" aria-hidden="true"><defs><linearGradient id="brand-thread"><stop stop-color="#E34234"/><stop offset=".5" stop-color="#E3A018"/><stop offset="1" stop-color="#E34234"/></linearGradient></defs><rect width="40" height="40" rx="11" fill="url(#brand-thread)"/><path d="M11.5 7.5h4v14l8-8h5l-8 8 8 10h-5l-6-7-2 2v5h-4z" fill="#fff"/></svg>
      <div><div class="brand-name">Kautuka</div><div class="brand-caption">ACCOUNT ACCESS</div></div>
    </div>
  <h1>Returning to Kautuka</h1>
  <p id="status">Returning to Kautuka…</p>
  <button id="retry" type="button" hidden>Retry</button>
  </main>
  <script type="module">
    const status = document.querySelector('#status');
    const retry = document.querySelector('#retry');
    const query = new URLSearchParams(location.search);
    const wrappedState = query.get('state') ?? '';
    const pendingKey = 'kautuka-bound-callback';

    if (wrappedState.startsWith('k2.')) {
      await completeBoundCallback();
    } else if (!wrappedState && sessionStorage.getItem(pendingKey)) {
      await submitBoundCallback();
    } else {
      status.textContent = 'This sign-in response is not valid. Start again from Kautuka.';
    }

    async function completeBoundCallback() {
      // Remove the provider response from the address bar before any network request.
      history.replaceState(null, '', location.pathname);
      try {
        if (query.getAll('state').length !== 1 || query.getAll('code').length > 1 || query.getAll('error').length > 1) throw new Error('Duplicate response');
        const code = query.get('code');
        const error = query.get('error');
        if ((code !== null) === (error !== null)) throw new Error('Invalid response');
        const body = { state: wrappedState };
        if (code !== null) body.code = code;
        else body.error = error;
        sessionStorage.setItem(pendingKey, JSON.stringify({ body, expires: Date.now() + 300000 }));
        await submitBoundCallback();
      } catch {
        status.textContent = 'Kautuka could not verify this browser session. Start again from Kautuka.';
      }
    }

    async function submitBoundCallback() {
      try {
        const pending = JSON.parse(sessionStorage.getItem(pendingKey) ?? 'null');
        if (!pending || pending.expires <= Date.now()) {
          sessionStorage.removeItem(pendingKey);
          throw new Error('Expired');
        }
        const response = await fetch('/handoff/callback', {
          method: 'POST', headers: { 'content-type': 'application/json' }, credentials: 'same-origin', body: JSON.stringify(pending.body),
        });
        if (response.status === 429 || response.status >= 500) throw new Error('Temporary failure');
        if (!response.ok) {
          sessionStorage.removeItem(pendingKey);
          throw new Error('Callback rejected');
        }
        sessionStorage.removeItem(pendingKey);
        retry.hidden = true;
        status.textContent = pending.body.error ? 'Sign-in was not completed. Return to your Kautuka tab.' : 'Sign-in completed. Return to your Kautuka tab.';
      } catch {
        retry.hidden = !sessionStorage.getItem(pendingKey);
        status.textContent = retry.hidden ? 'Kautuka could not verify this browser session. Start again from Kautuka.' : 'Connection interrupted. Try again.';
      }
    }
    retry.addEventListener('click', submitBoundCallback);

  </script>
</body>
</html>
