<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kautuka sign-in</title>
  <style>
    body { font-family: "Segoe UI", sans-serif; margin: 2rem; color: #1c1917; }
    p { max-width: 36rem; }
  </style>
</head>
<body>
  <p id="status">Continuing to sign in…</p>
  <script type="module">
    import { isAllowedReturn, returnPathFor } from '/return-path.js';

    const status = document.getElementById('status');
    const params = new URLSearchParams(location.hash.startsWith('#') ? location.hash.slice(1) : location.hash);
    const returnUrl = params.get('return');
    const connector = params.get('connector');
    const state = params.get('state');
    const challenge = params.get('challenge');
    const nonce = params.get('nonce');
    const login = returnPathFor(connector) === '/login/callback';
    if (!isAllowedReturn(returnUrl, connector) || !isConnector(connector) || !isPkce(state) || !isPkce(challenge) || (login && !isPkce(nonce))) {
      status.textContent = 'This sign-in link is not valid. Start again from Kautuka.';
    } else {
      sessionStorage.setItem('kautukaAuthReturn', returnUrl);
      sessionStorage.setItem('kautukaAuthConnector', connector);
      const next = new URL('/authorize', location.origin);
      next.searchParams.set('connector', connector);
      next.searchParams.set('state', state);
      next.searchParams.set('challenge', challenge);
      if (login) next.searchParams.set('nonce', nonce);
      location.replace(next.toString());
    }

    function isConnector(value) {
      return typeof value === 'string' && /^[a-z0-9-]{1,80}$/.test(value);
    }

    function isPkce(value) {
      return typeof value === 'string' && /^[A-Za-z0-9_-]{43,128}$/.test(value);
    }
  </script>
</body>
</html>
