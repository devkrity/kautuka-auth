<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kautuka sign-in</title>
  <style>
    body { font-family: "Segoe UI", sans-serif; margin: 2rem; color: #1c1917; }
    p { max-width: 36rem; }
  </style>
</head>
<body>
  <p id="status">Continuing to sign in…</p>
  <script>
    const status = document.getElementById('status');
    const params = new URLSearchParams(location.hash.startsWith('#') ? location.hash.slice(1) : location.hash);
    const returnUrl = params.get('return');
    const connector = params.get('connector');
    const state = params.get('state');
    const challenge = params.get('challenge');
    if (!isAllowedReturn(returnUrl) || !isConnector(connector) || !isPkce(state) || !isPkce(challenge)) {
      status.textContent = 'This sign-in link is not valid. Start again from the Kautuka Connectors page.';
    } else {
      sessionStorage.setItem('kautukaAuthReturn', returnUrl);
      const next = new URL('/authorize', location.origin);
      next.searchParams.set('connector', connector);
      next.searchParams.set('state', state);
      next.searchParams.set('challenge', challenge);
      location.replace(next.toString());
    }

    function isAllowedReturn(value) {
      if (!value) return false;
      let url;
      try { url = new URL(value); } catch { return false; }
      if (url.username || url.password) return false;
      if (url.pathname !== '/connectors') return false;
      if (url.search || url.hash) return false;
      if (url.protocol === 'https:') return true;
      if (url.protocol !== 'http:') return false;
      return isPrivateHost(url.hostname);
    }

    function isConnector(value) {
      return typeof value === 'string' && /^[a-z0-9-]{1,80}$/.test(value);
    }

    function isPkce(value) {
      return typeof value === 'string' && /^[A-Za-z0-9_-]{43,128}$/.test(value);
    }

    function isPrivateHost(host) {
      const name = host.toLowerCase();
      if (name === 'localhost' || name === '127.0.0.1' || name === '::1' || name.endsWith('.local')) return true;
      const parts = name.split('.').map(Number);
      if (parts.length === 4 && parts.every((part) => part >= 0 && part <= 255)) {
        if (parts[0] === 10) return true;
        if (parts[0] === 172 && parts[1] >= 16 && parts[1] <= 31) return true;
        if (parts[0] === 192 && parts[1] === 168) return true;
      }
      return false;
    }
  </script>
</body>
</html>
