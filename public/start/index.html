<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kautuka sign-in</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Segoe UI", system-ui, sans-serif;
      color: #102448;
      background: #fbfbfa;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      --kautuka-blue: #1858e8;
      --kautuka-ink: #102448;
      --kautuka-muted: #52617a;
      --kautuka-border: #d8dce3;
      --kautuka-surface: #f0f4fa;
    }
    * { box-sizing: border-box; }
    body {
      min-width: 320px;
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      padding: 32px 20px;
      display: grid;
      place-items: center;
      background:
        radial-gradient(ellipse at 50% 0%, rgb(24 88 232 / 8%), transparent 52%),
        #fbfbfa;
    }
    main {
      position: relative;
      width: min(100%, 480px);
      padding: 32px;
      overflow: hidden;
      border: 1px solid var(--kautuka-border);
      border-radius: 8px;
      background: #fff;
      box-shadow: 0 16px 44px rgb(16 36 72 / 9%);
    }
    main::before {
      position: absolute;
      inset: 0 0 auto;
      height: 4px;
      background: linear-gradient(90deg, #e34234, #e3a018, #e34234);
      content: "";
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      margin-bottom: 32px;
    }
    .brand-mark { width: 36px; height: 36px; flex: none; }
    .brand-name { font-size: 17px; font-weight: 700; letter-spacing: -.025em; }
    .brand-caption {
      margin-top: 2px;
      color: var(--kautuka-muted);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .12em;
    }
    h1 { margin: 0; color: var(--kautuka-ink); font-size: clamp(25px, 6vw, 30px); line-height: 1.2; letter-spacing: -.035em; }
    #status { margin: 10px 0 22px; color: var(--kautuka-muted); font-size: 14px; line-height: 1.55; }
    dl {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
      margin: 0 0 20px;
      padding: 18px;
      border: 1px solid #e5eaf2;
      border-radius: 6px;
      background: var(--kautuka-surface);
    }
    dl[hidden] { display: none; }
    dt { margin-bottom: 4px; color: var(--kautuka-muted); font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
    dd { margin: 0; color: var(--kautuka-ink); font-size: 14px; font-weight: 600; line-height: 1.5; overflow-wrap: anywhere; }
    .trust-note { display: flex; align-items: flex-start; gap: 9px; margin: 0 0 22px; color: var(--kautuka-muted); font-size: 12px; line-height: 1.5; }
    .trust-note svg { width: 16px; height: 16px; flex: none; margin-top: 1px; color: #385b97; }
    button {
      width: 100%;
      min-height: 46px;
      padding: 11px 18px;
      border: 1px solid var(--kautuka-blue);
      border-radius: 4px;
      background: var(--kautuka-blue);
      color: #fff;
      font: inherit;
      font-size: 14px;
      font-weight: 650;
      cursor: pointer;
      transition: background-color 140ms ease, box-shadow 140ms ease, transform 140ms ease;
    }
    button:hover:not(:disabled) { background: #1049c7; box-shadow: 0 4px 12px rgb(24 88 232 / 20%); }
    button:active:not(:disabled) { transform: translateY(1px); }
    button:focus-visible { outline: 3px solid #ffbf47; outline-offset: 3px; }
    button:disabled { cursor: not-allowed; opacity: .58; }
    @media (max-width: 480px) { main { padding: 26px 22px; } .brand { margin-bottom: 26px; } }
    @media (prefers-reduced-motion: reduce) { button { transition: none; } }
  </style>
</head>
<body>
  <main>
    <div class="brand" aria-label="Kautuka secure access">
      <svg class="brand-mark" viewBox="0 0 40 40" aria-hidden="true">
        <defs>
          <linearGradient id="brand-thread"><stop stop-color="#E34234"/><stop offset=".5" stop-color="#E3A018"/><stop offset="1" stop-color="#E34234"/></linearGradient>
        </defs>
        <rect width="40" height="40" rx="11" fill="url(#brand-thread)"/>
        <path d="M11.5 7.5h4v14l8-8h5l-8 8 8 10h-5l-6-7-2 2v5h-4z" fill="#fff"/>
      </svg>
      <div>
        <div class="brand-name">Kautuka</div>
        <div class="brand-caption">SECURE ACCOUNT ACCESS</div>
      </div>
    </div>
    <h1>Confirm sign-in</h1>
    <p id="status">Review the destination and request before continuing.</p>
    <dl id="request-details" hidden>
      <dt>Appliance</dt><dd id="appliance-origin"></dd>
      <dt>Request</dt><dd id="request-purpose"></dd>
    </dl>
    <p class="trust-note">
      <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M10 2.5 3.5 5v4.7c0 4.1 2.8 6.7 6.5 7.8 3.7-1.1 6.5-3.7 6.5-7.8V5L10 2.5Z" stroke="currentColor" stroke-width="1.5"/><path d="m7.2 10 1.8 1.8 3.8-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Continue only if you started this request from your Kautuka appliance.
    </p>
    <button id="confirm" type="button">Confirm and continue</button>
  </main>
  <script type="module">
    import { isAllowedReturn, returnPathFor } from '/return-path.js';

    const status = document.querySelector('#status');
    const button = document.querySelector('#confirm');
    const details = document.querySelector('#request-details');
    const originLabel = document.querySelector('#appliance-origin');
    const purposeLabel = document.querySelector('#request-purpose');
    const params = new URLSearchParams(location.hash.slice(1));
    const data = {
      returnUrl: params.get('return'),
      connector: params.get('connector'),
      state: params.get('state'),
      challenge: params.get('challenge'),
      nonce: params.get('nonce'),
      microsoftAccountType: params.get('microsoftAccountType'),
    };
    const login = returnPathFor(data.connector) === '/login/callback';
    const purposes = {
      'kautuka-google-mail': 'Connect a Google mailbox to Kautuka',
      'kautuka-m365-mail': 'Connect a Microsoft 365 mailbox to Kautuka',
      'kautuka-login-google': 'Sign in to Kautuka with Google',
      'kautuka-login-microsoft': 'Sign in to Kautuka with Microsoft',
    };
    const valid = isAllowedReturn(data.returnUrl, data.connector)
      && /^[A-Za-z0-9_-]{43,128}$/.test(data.state ?? '')
      && /^[A-Za-z0-9_-]{43,128}$/.test(data.challenge ?? '')
      && (!login || /^[A-Za-z0-9_-]{43,128}$/.test(data.nonce ?? ''))
      && (data.microsoftAccountType == null
        || data.connector === 'kautuka-login-microsoft'
          && ['organizations', 'consumers'].includes(data.microsoftAccountType));

    if (!valid) {
      status.textContent = 'This sign-in link is not valid. Start again from Kautuka.';
      button.disabled = true;
    } else {
      originLabel.textContent = new URL(data.returnUrl).origin;
      purposeLabel.textContent = purposes[data.connector];
      details.hidden = false;
      button.addEventListener('click', confirmRequest);
    }

    async function confirmRequest() {
      button.disabled = true;
      status.textContent = 'Starting sign-in…';
      try {
        const response = await fetch('/start/confirm', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify(data),
        });
        if (!response.ok) throw new Error('Confirmation failed');
        const { ticket } = await response.json();
        sessionStorage.setItem('kautukaAuthReturn', data.returnUrl);
        sessionStorage.setItem('kautukaAuthTicket', ticket);
        const next = new URL('/authorize', location.origin);
        next.searchParams.set('ticket', ticket);
        location.replace(next.toString());
      } catch {
        button.disabled = false;
        status.textContent = 'Sign-in could not start. Try again from Kautuka.';
      }
    }
  </script>
</body>
</html>
